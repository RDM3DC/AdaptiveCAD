[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-compression-suite"
version = "0.1.0"
description = "Three complementary compression methods: ATC (text), CMC (curves), GPUC (arrays)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "RDM3DC"}]

dependencies = [
	"numpy>=1.24",
	"trimesh>=4.0",
	"shapely>=2.0",
	"scikit-image>=0.22",
	"lxml>=4.9",
]

[project.scripts]
acs-atc-encode = "atc.cli:encode_main"
acs-atc-decode = "atc.cli:decode_main"
acs-cmc-encode-1d = "cmc.cli:encode_1d_main"
acs-cmc-decode-1d = "cmc.cli:decode_1d_main"
acs-cmc-encode-2d = "cmc.cli:encode_2d_main"
acs-cmc-decode-2d = "cmc.cli:decode_2d_main"
acs-gpuc-quantize = "gpuc.cli:quantize_main"
acs-gpuc-dequantize = "gpuc.cli:dequantize_main"
acs-gpuc-zerosuppress = "gpuc.cli:zerosuppress_main"
acs-gpuc-unsuppress = "gpuc.cli:unsuppress_main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
extend-exclude = "^blender_addons/|^freecad/"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = [
	"blender_addons/*",
	"freecad/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
	"blender_addons",
	"freecad",
	"adaptive-resistance-site",
	"blender_cli_apollonian.py",  # corrupted file needs manual fix
	"apps-sdk",  # external SDK
]

[tool.ruff.lint]
select = [
	"E", "F", "I",   # pycodestyle, pyflakes, import sorting
]
ignore = [
	"E203",  # whitespace before ':' (black compatible)
	"E501",  # line-too-long (handled by formatter)
	"E701",  # multiple statements on one line (colon) - common in shader-like code
	"E702",  # multiple statements on one line (semicolon) - common in shader-like code
	"E741",  # ambiguous variable name (l, O, I) - common in math/physics code
	"F405",  # star import usage - valid for OCC patterns
	"F403",  # star imports - valid for OCC patterns
	"E402",  # module import not at top - often intentional for conditional imports
]

[tool.ruff.lint.per-file-ignores]
# Shader and graphics code often needs dense syntax
"adaptivecad/aacore/sdf.py" = ["E501", "E701", "E702"]
"adaptivecad/aacore/shaders/*.py" = ["E501", "E701", "E702"]
"*.glsl" = ["E501", "E701", "E702"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
no_strict_optional = true
pretty = true
files = "adaptivecad"
exclude = [
	"blender_addons/",
	"freecad/",
]
