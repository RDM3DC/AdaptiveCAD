name: Deploy AdaptiveCAD Website to GitHub Pages

on:
  push:
    branches: [ main ]
    paths: [ 'adaptive-resistance-site/**' ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: adaptive-resistance-site/package-lock.json
          
      - name: Install dependencies
        run: |
          cd adaptive-resistance-site
          npm ci || npm install
          
      - name: Build website
        run: |
          cd adaptive-resistance-site
          npm run build
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: adaptive-resistance-site/dist
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4