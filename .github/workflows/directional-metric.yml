name: Directional metric tests

on:
  push:
    paths:
      - 'adaptivecad/**'
      - 'tests/test_directional_metric.py'
      - 'examples/directional_metric_demo.py'
      - '.github/workflows/directional-metric.yml'
  pull_request:
    paths:
      - 'adaptivecad/**'
      - 'tests/test_directional_metric.py'
      - 'examples/directional_metric_demo.py'
      - '.github/workflows/directional-metric.yml'

permissions:
  contents: read

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install headless test dependencies
        run: python -m pip install 'numpy>=1.24' 'pytest>=7'
      - name: Test actual checkout without unrelated GUI conftest hooks
        run: python -m pytest -q --noconftest tests/test_directional_metric.py
      - name: Run example
        run: python -m examples.directional_metric_demo
