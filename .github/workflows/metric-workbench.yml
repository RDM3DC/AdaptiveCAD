name: Metric workbench
on:
  push:
    branches: ['feat/metric-workbench-tools']
  pull_request:
    paths:
      - 'adaptivecad/geom/*metric*.py'
      - 'adaptivecad/metric_project.py'
      - 'adaptivecad/gui/metric_*.py'
      - 'adaptivecad/app/__main__.py'
      - 'run_playground.py'
      - 'run_adaptivecad.py'
      - 'tests/test_metric_*.py'
      - 'scripts/metric_app_smoke.py'
      - '.github/workflows/metric-workbench.yml'
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.11'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      METRIC_WORKBENCH_SCREENSHOT: test-results/workbench.png
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test dependencies
        run: python -m pip install numpy scipy pytest PySide6 PyOpenGL ruff
      - name: Core and real Qt tests
        run: python -m pytest -q --noconftest tests/test_directional_metric.py tests/test_metric_tools.py tests/test_metric_project.py tests/test_metric_workbench.py --junitxml=test-results/tests.xml
      - name: Dependency record
        if: always()
        run: python -m pip freeze
      - name: Collect formatting diagnostics without changing tested source
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p test-results
          python -m ruff check adaptivecad/geom/metric_tools.py adaptivecad/geom/metric_geodesic.py adaptivecad/metric_project.py adaptivecad/gui/metric_workbench.py adaptivecad/gui/metric_launch.py tests/test_metric_tools.py tests/test_metric_project.py tests/test_metric_workbench.py scripts/metric_app_smoke.py --output-format json > test-results/lint.json || true
          python -m pip download --no-deps ruff -d test-results/wheels
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metric-tests-${{ matrix.os }}-${{ matrix.python }}
          path: test-results
          retention-days: 7
  app-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install application smoke dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libegl1 libopengl0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0
          python -m pip install numpy scipy PySide6 PyOpenGL shapely
      - name: Existing SDF application with dock
        run: xvfb-run -a python -m scripts.metric_app_smoke --ui sdf --output test-results
      - name: Existing Playground with dock
        if: always()
        run: xvfb-run -a python -m scripts.metric_app_smoke --ui playground --output test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: metric-app-smoke
          path: test-results
          retention-days: 7
