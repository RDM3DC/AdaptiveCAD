name: Prepare release cleanup
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/prepare_ruff_cleanup.py'
      - 'tests/test_release_cleanup.py'
      - '.github/workflows/prepare-release-cleanup.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/workbench-release-readiness'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon-x11-0
          python -m pip install -e .
          python -m pip install pytest pytest-timeout ruff PySide6 PyOpenGL scipy matplotlib pandas pillow
      - name: Record that regressions fail before remediation
        shell: python
        run: |
          import pathlib, subprocess, sys
          out = pathlib.Path('cleanup-review')
          out.mkdir(exist_ok=True)
          with (out / 'regressions-before.log').open('w') as log:
              result = subprocess.run([sys.executable, '-m', 'pytest', '-q', '--noconftest', 'tests/test_release_cleanup.py'], stdout=log, stderr=subprocess.STDOUT)
          if result.returncode != 1:
              raise SystemExit('Expected reproducible assertion failures before the cleanup')
      - name: Prepare reviewed changes in working copy only
        run: python scripts/prepare_ruff_cleanup.py
      - name: Keep sweep plot data separate from spatial grid
        shell: python
        run: |
          from pathlib import Path
          p = Path('AdaptiveCAD_Shipping_Track_v1/adaptivecad_fields_optimizer.py')
          text = p.read_text(encoding='utf-8')
          changes = [
              ('    ys = [r["DeltaT_mean"] for r in sum_coarse]', '    ys_plot = [r["DeltaT_mean"] for r in sum_coarse]'),
              ('    plt.errorbar(xs_plot, ys, yerr=es, marker="o")', '    plt.errorbar(xs_plot, ys_plot, yerr=es, marker="o")'),
          ]
          for old, new in changes:
              if text.count(old) != 1:
                  raise SystemExit('Unexpected field sweep source')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
      - name: Entire Ruff gate and all feature regressions
        run: |
          python -m ruff check .
          python -m pytest -q -ra --noconftest tests/test_directional_metric.py tests/test_meshfree_tools.py tests/test_meshfree_workbench.py tests/test_metric_tools.py tests/test_metric_project.py tests/test_metric_workbench.py tests/test_metric_layout.py tests/test_integrated_workbench.py tests/test_metric_curve_transfer.py tests/test_curve_transfer_ui.py tests/test_release_cleanup.py --timeout=60 --junitxml=cleanup-review/tests.xml
      - name: Prepare Git blob objects only, never a commit or branch update
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, urllib.request, zipfile
          root = pathlib.Path.cwd()
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if head != os.environ['SOURCE_HEAD']:
              raise SystemExit('Unexpected checkout revision')
          names = subprocess.check_output(['git', 'diff', '--name-only', '-z']).decode().split('\0')
          baseline = json.loads(pathlib.Path('cleanup-review/ruff-before.json').read_text())
          allowed = {str(pathlib.Path(d['filename']).relative_to(root)) for d in baseline}
          manifest = {'parent': head, 'files': []}
          with zipfile.ZipFile('cleanup-review/reviewed-source.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in names:
                  if not name:
                      continue
                  path = root / name
                  if name not in allowed or path.is_symlink() or not name.endswith('.py'):
                      raise SystemExit('Unexpected changed file: ' + name)
                  data = path.read_bytes()
                  expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                  body = json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}).encode()
                  req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      actual = json.load(response)['sha']
                  if actual != expected:
                      raise SystemExit('Blob integrity mismatch: ' + name)
                  manifest['files'].append({'path': name, 'blob': actual, 'sha256': hashlib.sha256(data).hexdigest()})
                  archive.writestr(name, data)
          pathlib.Path('cleanup-review/blob-manifest.json').write_text(json.dumps(manifest, indent=2))
          pathlib.Path('cleanup-review/cleanup.patch').write_bytes(subprocess.check_output(['git', 'diff', '--no-ext-diff']))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prepared-cleanup
          path: cleanup-review
          retention-days: 7
